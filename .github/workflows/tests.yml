name: tests

on:
  # MATLAB runs automatically when a .m file changes; Nelson and RunMat only
  # on demand (Actions tab > tests > Run workflow).
  push:
    branches: [main]
    paths: ["**.m"]
  pull_request:
    branches: [main]
    paths: ["**.m"]
  workflow_dispatch:
    inputs:
      runmat_version:
        description: "RunMat version for the RunMat job"
        type: choice
        options: ["0.6.2", "latest"]
        default: "0.6.2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hugging Face revision of the checkpoint, as in src/tabicl_load.m
  CKPT_REV: 4dcd344ece2c00be9e831fdd35bed57b5ad83e19

jobs:
  # Download the two 110 MB checkpoints once and cache weights/ for the other jobs,
  # laid out exactly as tabicl_load() would leave it.
  weights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v6
        with:
          path: weights
          key: tabicl-weights-${{ env.CKPT_REV }}-${{ hashFiles('assets/*.idx') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p weights
          for name in tabicl-classifier-v2-20260212 tabicl-regressor-v2-20260212; do
            curl -fsSL --retry 3 -o weights/ckpt.zip \
              "https://huggingface.co/jingang/TabICL/resolve/$CKPT_REV/$name.ckpt"
            unzip -q weights/ckpt.zip -d "weights/$name"
            rm weights/ckpt.zip
            ls "weights/$name"/*/data/0
          done

  matlab:
    needs: weights
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: weights
          key: tabicl-weights-${{ env.CKPT_REV }}-${{ hashFiles('assets/*.idx') }}
          fail-on-cache-miss: true
      - uses: matlab-actions/setup-matlab@v3
        with:
          cache: true
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('src'); run('tests/run_tests.m')
      - uses: matlab-actions/run-command@v3
        with:
          command: run('examples/two_moons.m'); run('examples/vibration_faults.m'); run('examples/load_forecasting.m')

  # maticl is developed on Nelson 2.0, but only 1.17 has a Linux build, and
  # it lacks strtok and runs out of memory: informational until 2.0 ships.
  nelson:
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    needs: weights
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NELSON_VERSION: 1.17.0
      NELSON_BUILD: 6016
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: weights
          key: tabicl-weights-${{ env.CKPT_REV }}-${{ hashFiles('assets/*.idx') }}
          fail-on-cache-miss: true
      - name: Install Nelson
        run: |
          deb="nelson-Ubuntu-24.04-x86_64-v$NELSON_VERSION.$NELSON_BUILD.deb"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$deb" \
            "https://github.com/nelson-lang/nelson/releases/download/v$NELSON_VERSION/$deb"
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends "$RUNNER_TEMP/$deb"
          nelson-cli --version
      - run: nelson-cli --quiet -f tests/run_tests.m

  # About 20 minutes.
  runmat:
    if: github.event_name == 'workflow_dispatch'
    needs: weights
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: weights
          key: tabicl-weights-${{ env.CKPT_REV }}-${{ hashFiles('assets/*.idx') }}
          fail-on-cache-miss: true
      - name: Install RunMat
        env:
          RUNMAT_VERSION: ${{ inputs.runmat_version }}
        run: |
          if [ "$RUNMAT_VERSION" = "0.6.2" ]; then
            # The installer takes the newest release from its manifest: pin
            # the tested version with a one-row manifest (same SHA-256 check).
            printf '1\tlinux-x86_64\t0.6.2\t%s\t%s\t\t\t\n' \
              https://updates.runmat.com/prod/tools/releases/0.6.2/linux-x86_64/runmat-tools-0.6.2-linux-x86_64.tar.gz \
              daeb075c6cbe4eba968c9c9aeedae514d1a1e068c53152f8807383b24a738ef3 \
              > "$RUNNER_TEMP/runmat-manifest.tsv"
            export RUNMAT_INSTALL_MANIFEST_URL="file://$RUNNER_TEMP/runmat-manifest.tsv"
          fi
          curl -fsSL https://runmat.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # RunMat compiles every .m file in the working directory: run from an
      # empty one.
      - run: |
          cd "$(mktemp -d)"
          runmat "$GITHUB_WORKSPACE/tests/run_tests.m"
